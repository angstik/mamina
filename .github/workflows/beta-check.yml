name: Check Mamina Beta
on:
  push:
    branches: ["beta"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mamina-beta-check
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: mamina-beta-dist
          path: dist
          retention-days: 7
